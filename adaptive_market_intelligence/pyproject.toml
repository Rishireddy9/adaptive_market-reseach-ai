[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-market-intelligence"
version = "0.1.0"
description = "Adaptive market intelligence simulation based on the architecture document"
readme = ""
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "sqlalchemy>=2.0.30",
  "scikit-learn>=1.5.0",
]

[project.scripts]
adaptive-market-intelligence = "adaptive_market_intelligence.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
